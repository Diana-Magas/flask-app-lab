<header class="site-header sticky-top">
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="brand" href="{{ url_for('resume') }}">
        <span class="brand-dot"></span> Diana Mahas
      </a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#mainNav"
        aria-controls="mainNav"
        aria-expanded="false"
        aria-label="Перемкнути меню"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item">
            <a
              class="nav-link {% if request.endpoint == 'home' %}active{% endif %}"
              href="{{ url_for('home') }}"
              >Головна</a
            >
          </li>
          <li class="nav-item">
            <a
              class="nav-link {% if request.endpoint == 'resume' %}active{% endif %}"
              href="{{ url_for('resume') }}"
              >Резюме</a
            >
          </li>
          <li class="nav-item">
            <a
              class="nav-link {% if request.endpoint == 'contacts' %}active{% endif %}"
              href="{{ url_for('contacts') }}"
              >Контакти</a
            >
          </li>
          <li class="nav-item">
            <a
              class="nav-link {% if request.endpoint == 'users.profile' %}active{% endif %}"
              href="{{ url_for('users.profile') }}"
              >Профіль</a
            >
          </li>

          {% if session.get('username') %}
          <li class="nav-item ms-lg-3">
            <span class="navbar-text">
              <i class="bi bi-person-circle"></i> {{ session['username'] }}
            </span>
          </li>
          <li class="nav-item ms-lg-2">
            <form method="POST" action="{{ url_for('users.logout') }}">
              <button type="submit" class="btn btn-outline-danger btn-sm">
                Вийти
              </button>
            </form>
          </li>
          {% else %}
          <li class="nav-item">
            <a
              class="nav-link {% if request.endpoint == 'users.login' %}active{% endif %}"
              href="{{ url_for('users.login') }}"
              >Вхід</a
            >
          </li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>
</header>
