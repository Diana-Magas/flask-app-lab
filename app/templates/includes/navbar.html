<header class="site-header sticky-top">
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="brand" href="{{ url_for('resume') }}">
        <span class="brand-dot"></span> Diana Mahas
      </a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#mainNav"
        aria-controls="mainNav"
        aria-expanded="false"
        aria-label="Перемкнути меню"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item">
            <a
              class="nav-link {% if request.endpoint == 'home' %}active{% endif %}"
              href="{{ url_for('home') }}"
              >Головна</a
            >
          </li>
          <li class="nav-item">
            <a
              class="nav-link {% if request.endpoint == 'resume' %}active{% endif %}"
              href="{{ url_for('resume') }}"
              >Резюме</a
            >
          </li>
          <li class="nav-item">
            <a
              class="nav-link {% if request.endpoint == 'contacts' %}active{% endif %}"
              href="{{ url_for('contacts') }}"
              >Контакти</a
            >
          </li>
          <li class="nav-item">
            <a
              class="nav-link {% if request.blueprint == 'posts' %}active{% endif %}"
              href="{{ url_for('posts.all_posts') }}"
              >Пости</a
            >
          </li>

          {% if current_user.is_authenticated %}
          <li class="nav-item">
            <a
              class="nav-link {% if request.endpoint == 'users.users_list' %}active{% endif %}"
              href="{{ url_for('users.users_list') }}"
              >Користувачі</a
            >
          </li>
          <li class="nav-item">
            <a
              class="nav-link {% if request.endpoint == 'users.account' %}active{% endif %}"
              href="{{ url_for('users.account') }}"
              ><i class="bi bi-person-circle"></i> Профіль</a
            >
          </li>
          <li class="nav-item ms-lg-2">
            <form method="POST" action="{{ url_for('users.logout') }}">
              <button type="submit" class="btn btn-outline-danger btn-sm">
                Вихід
              </button>
            </form>
          </li>
          {% else %}
          <li class="nav-item">
            <a
              class="nav-link {% if request.endpoint == 'users.login' %}active{% endif %}"
              href="{{ url_for('users.login') }}"
              >Вхід</a
            >
          </li>
          <li class="nav-item">
            <a
              class="nav-link {% if request.endpoint == 'users.register' %}active{% endif %}"
              href="{{ url_for('users.register') }}"
              >Реєстрація</a
            >
          </li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>
</header>
