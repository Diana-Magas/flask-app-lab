<header class="site-header sticky-top">
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="brand" href="{{ url_for('resume') }}">
        <span class="brand-dot"></span> Diana Mahas
      </a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#mainNav"
        aria-controls="mainNav"
        aria-expanded="false"
        aria-label="Перемкнути меню"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          {% set sections = [ ('about', 'Про себе'), ('education', 'Освіта'),
          ('skills', 'Навички'), ('technologies', 'Технології'), ('projects',
          'Проєкти') ] %} {% for section_id, label in sections %}
          <li class="nav-item">
            <a
              class="nav-link"
              href="{{ url_for('resume', _anchor=section_id) }}"
              >{{ label }}</a
            >
          </li>
          {% endfor %}
          <li class="nav-item">
            <a
              class="nav-link {% if request.endpoint == 'contacts' %}active{% endif %}"
              href="{{ url_for('contacts') }}"
              >Контакти</a
            >
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>
