{% extends "base.html" %} {% block content %}
<div class="container mt-4">
  <h2>Усі публікації</h2>
  <a href="{{ url_for('posts.create_post') }}" class="btn btn-success mb-3"
    >Створити новий пост</a
  >

  {% for post in posts %}
  <div class="card mb-3">
    <div class="card-body">
      <h3 class="card-title">{{ post.title }}</h3>
      <p class="card-text">{{ post.content[:100] }}...</p>
      <a
        href="{{ url_for('posts.detail_post', id=post.id) }}"
        class="btn btn-primary btn-sm"
        >Детальніше</a
      >
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
