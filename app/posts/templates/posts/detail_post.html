{% extends 'base.html' %} {% block css %}
<link
  rel="stylesheet"
  href="{{ url_for('posts.static', filename='css/posts.css') }}"
/>
{% endblock %} {% block content %}
<article class="post-detail">
  <h1>{{ post.title }}</h1>
  <p class="text-muted">
    Author: {{ post.author }} · Category: {{ post.category or '—' }} · {{
    post.posted.strftime('%d.%m.%Y %H:%M') }}
  </p>
  <p>{{ post.content }}</p>

  <a
    href="{{ url_for('posts.update_post', id=post.id) }}"
    class="btn btn-warning"
    >Edit</a
  >
  <a
    href="{{ url_for('posts.delete_post', id=post.id) }}"
    class="btn btn-danger"
    >Delete</a
  >
  <a href="{{ url_for('posts.all_posts') }}" class="btn btn-secondary">Back</a>
</article>
{% endblock %}
