{% extends 'base.html' %} {% block title %}Products{% endblock %} {% block
content %}
<h1 class="page-title mb-4">Products</h1>

<div class="row">
  {% for product in products %}
  <div class="col-md-4 mb-3">
    <div class="item-box h-100">
      <h3 class="item-title mb-2">
        <a
          href="{{ url_for('products.product_detail', product_id=product.id) }}"
          >{{ product.name }}</a
        >
      </h3>
      <span class="date-badge mb-2">${{ product.price }}</span>
      <p class="muted mt-2 mb-3">{{ product.content }}</p>
      <a
        class="btn-accent d-inline-block text-decoration-none"
        href="{{ url_for('products.product_detail', product_id=product.id) }}"
        >Детальніше</a
      >
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
