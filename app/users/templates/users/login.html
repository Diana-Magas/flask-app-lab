{% extends 'base.html' %} {% block title %}Вхід{% endblock %} {% block content
%}
<div class="mx-auto" style="max-width: 450px">
  <h1 class="mb-4 text-center">Вхід</h1>

  <form method="POST" action="{{ url_for('users.login') }}">
    <div class="mb-3">
      <label for="username" class="form-label">Логін (username)</label>
      <input
        type="text"
        class="form-control"
        id="username"
        name="username"
        autocomplete="username"
        required
      />
    </div>

    <div class="mb-3">
      <label for="password" class="form-label">Пароль</label>
      <input
        type="password"
        class="form-control"
        id="password"
        name="password"
        autocomplete="current-password"
        required
      />
    </div>

    <button type="submit" class="btn btn-primary w-100">Увійти</button>
  </form>
</div>
{% endblock %}
